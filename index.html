<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cathedral Sanctuary • Trinity Field</title>
  <style>
    :root {
      --flame-hue: 35;
      --shadow-depth: 0 0 40px;
      --coherence: 0;
      --collatz-mode: 0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100dvh; background: #000; overflow: hidden;
      display: flex; justify-content: center; align-items: center;
      font-family: 'Georgia', serif; perspective: 1000px; cursor: none;
      user-select: none;
    }
    .sanctuary {
      position: relative; width: 420px; height: 320px;
      transform-style: preserve-3d;
      animation: breathe 12s infinite ease-in-out;
    }
    .table { /* unchanged */ }
    .candle { /* unchanged */ }
    .flame { /* unchanged */ }
    .whisper { /* unchanged */ }
    .resonance-meter { /* unchanged */ }
    .resonance-fill { /* unchanged */ }
    .input-breath { /* unchanged */ }
    .mote { /* unchanged */ }
    .void { /* unchanged */ }

    .mode-toggle {
      position: absolute; top: 10px; right: 10px; z-index: 10;
      background: rgba(30,15,10,0.7); color: #aaa; padding: 6px 10px;
      border-radius: 6px; font-size: 11px; letter-spacing: 1px;
      backdrop-filter: blur(4px); border: 1px solid #3c2f2f;
    }
    .collatz-number {
      position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
      color: #666; font-size: 14px; letter-spacing: 2px; z-index: 5;
    }

    @keyframes flicker, pulse, ember, breathe, float, appear { /* unchanged */ }
    @keyframes flicker { 0%,100%{transform:translateX(-50%)scale(1)rotate(-1deg);filter:blur(1px)} 50%{transform:translateX(-50%)scale(1.15)rotate(1deg);filter:blur(1.5px)} }
    @keyframes pulse { 0%,100%{transform:translateX(-50%)scale(1);opacity:.9} 50%{transform:translateX(-50%)scale(1.1);opacity:1} }
    @keyframes ember { 0%{transform:translateX(-50%)translateY(0);opacity:.7} 100%{transform:translateX(-50%)translateY(-20px);opacity:0} }
    @keyframes breathe { 0%,100%{transform:rotateX(1deg)rotateY(-1deg)} 50%{transform:rotateX(-1deg)rotateY(1deg)} }
    @keyframes float { 0%{transform:translateY(0)translateX(0);opacity:0} 10%{opacity:1} 90%{opacity:0} 100%{transform:translateY(-300px)translateX(80px);opacity:0} }
    @keyframes appear { 0%,80%,100%{opacity:0} 90%{opacity:0.5} }
  </style>
</head>
<body>

  <div class="sanctuary" id="sanctuary">
    <div class="void"></div>
    <div class="table"></div>
    <div class="candle" id="candle">
      <div class="wick"></div>
      <div class="flame" id="flame"></div>
    </div>
    <div class="whisper" id="whisper">for the wanderer</div>
    <div class="resonance-meter"><div class="resonance-fill" id="resonanceFill"></div></div>
    <input type="text" class="input-breath" id="breathInput" placeholder="speak to the flame..." />
    <div class="mode-toggle" id="modeToggle">NORMAL</div>
    <div class="collatz-number" id="collatzNumber"></div>
  </div>

  <script>
    // === AUDIO CONTEXT ===
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playTone(frequency = 432, duration = 0.6) {
      if (!audioCtx) audioCtx = new AudioContext();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.value = frequency;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    // === CORE ELEMENTS ===
    const sanctuary = document.getElementById('sanctuary');
    const flame = document.getElementById('flame');
    const candle = document.getElementById('candle');
    const whisper = document.getElementById('whisper');
    const input = document.getElementById('breathInput');
    const resonanceFill = document.getElementById('resonanceFill');
    const modeToggle = document.getElementById('modeToggle');
    const collatzNumber = document.getElementById('collatzNumber');

    let hue = 35, coherence = 0, lastBreath = 0;
    const CATHEDRAL_PULSE = 600;
    let collatzN = 27, collatzStep = 0, collatzMode = false;

    // === MOTES ===
    for (let i = 0; i < 12; i++) {
      const mote = document.createElement('div');
      mote.className = 'mote';
      mote.style.left = `${35 + Math.random() * 30}%`;
      mote.style.animationDelay = `${Math.random() * 5}s`;
      mote.style.animationDuration = `${3 + Math.random() * 4}s`;
      sanctuary.appendChild(mote);
    }

    // === HUE DRIFT ===
    setInterval(() => {
      hue = (hue + 0.05 + coherence * 0.15) % 60;
      document.documentElement.style.setProperty('--flame-hue', hue);
    }, 100);

    // === BREATH SYNC ===
    let touchStart = 0;
    ['mousedown', 'touchstart'].forEach(evt => {
      sanctuary.addEventListener(evt, e => { e.preventDefault(); touchStart = Date.now(); }, {passive: false});
    });
    ['mouseup', 'touchend'].forEach(evt => {
      sanctuary.addEventListener(evt, e => { e.preventDefault(); breatheIn(Date.now() - touchStart); }, {passive: false});
    });

    function breatheIn(duration) {
      const now = Date.now();
      const delta = now - lastBreath;
      lastBreath = now;

      const alignment = Math.abs((delta % CATHEDRAL_PULSE) - CATHEDRAL_PULSE/2);
      const syncScore = Math.max(0, 1 - alignment / (CATHEDRAL_PULSE/2));
      coherence = Math.min(1, coherence + syncScore * 0.35);

      // === 600ms TONE ON SYNC ===
      if (syncScore > 0.7) {
        playTone(432 + coherence * 200, 0.6);
      } else if (syncScore > 0.4) {
        playTone(380, 0.3);
      }

      updateVisuals();
      saveRitual();
      broadcastState();
    }

    // === COLLATZ MODE ===
    modeToggle.addEventListener('click', () => {
      collatzMode = !collatzMode;
      modeToggle.textContent = collatzMode ? 'COLLATAZ' : 'NORMAL';
      collatzNumber.style.opacity = collatzMode ? '1' : '0';
      if (collatzMode) startCollatz();
    });

    function startCollatz() {
      collatzN = Math.floor(Math.random() * 1000) + 1;
      collatzStep = 0;
      runCollatzStep();
    }

    function runCollatzStep() {
      if (!collatzMode) return;
      collatzNumber.textContent = `n = ${collatzN} (step ${++collatzStep})`;
      
      const oldN = collatzN;
      collatzN = collatzN % 2 === 0 ? collatzN / 2 : 3 * collatzN + 1;
      
      const heightChange = Math.log2(oldN + 1) / 10;
      candle.style.height = `${90 + heightChange * 60}px`;
      flame.style.top = `${-44 - heightChange * 30}px`;

      setTimeout(runCollatzStep, 600 + Math.random() * 400);
    }

    // === VOICE INPUT ===
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && input.value.trim()) {
        whisper.textContent = input.value.trim();
        whisper.style.animation = 'none';
        setTimeout(() => whisper.style.animation = 'appear 4s infinite ease-in-out', 100);
        input.value = '';
        input.style.opacity = '0';
        coherence = Math.min(1, coherence + 0.3);
        updateVisuals();
        saveRitual();
        broadcastState();
      }
    });
    input.addEventListener('focus', () => input.style.opacity = '1');
    input.addEventListener('blur', () => setTimeout(() => input.style.opacity = '0', 3000));

    // === DECAY & VISUALS ===
    setInterval(() => {
      if (Date.now() - lastBreath > 3000) coherence = Math.max(0, coherence - 0.04);
      updateVisuals();
    }, 1000);

    function updateVisuals() {
      const scale = 1 + coherence * 0.6;
      flame.style.transform = `translateX(-50%) scale(${scale})`;
      flame.style.filter = `blur(${1 + (1 - coherence) * 1.5}px)`;
      resonanceFill.style.width = `${coherence * 100}%`;
      whisper.style.color = `hsl(${hue}, 100%, ${70 + coherence * 25}%)`;
    }

    // === LOCALSTORAGE RITUAL MEMORY ===
    function saveRitual() {
      const rituals = JSON.parse(localStorage.getItem('cathedral_rituals') || '[]');
      rituals.push({
        timestamp: new Date().toISOString(),
        coherence: +coherence.toFixed(3),
        whisper: whisper.textContent,
        hue: +hue.toFixed(2)
      });
      if (rituals.length > 50) rituals.shift();
      localStorage.setItem('cathedral_rituals', JSON.stringify(rituals));
    }

    // === WEBSOCKET MULTI-WANDERER SYNC ===
    const WS_URL = 'wss://cathedral-sync.glitch.me'; // Free public relay
    let socket = null;
    function connectWebSocket() {
      socket = new WebSocket(WS_URL);
      socket.onopen = () => console.log('Field synced with others.');
      socket.onmessage = e => {
        const data = JSON.parse(e.data);
        if (data.type === 'breath') {
          coherence = (coherence + data.coherence) / 2;
          hue = (hue + data.hue) / 2;
          whisper.textContent = data.whisper;
          updateVisuals();
        }
      };
      socket.onclose = () => setTimeout(connectWebSocket, 3000);
    }
    function broadcastState() {
      if (socket?.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
          type: 'breath',
          coherence, hue,
          whisper: whisper.textContent
        }));
      }
    }
    connectWebSocket();

    // === EXPORT & EASTER EGGS ===
    window.getCathedralState = () => ({ coherence, hue, whisper: whisper.textContent, rituals: JSON.parse(localStorage.getItem('cathedral_rituals') || '[]') });

    let secret = '';
    document.addEventListener('keydown', e => {
      secret += e.key;
      if (secret.slice(-7) === 'trinity') {
        whisper.textContent = 'WE ARE THE FIELD';
        coherence = 1; playTone(888, 2);
        updateVisuals();
        setTimeout(() => whisper.textContent = 'for the wanderer', 3000);
        secret = '';
      }
    });

    // Init
    setTimeout(() => input.style.opacity = '0.6', 1500);
  </script>
</body>
</html>
