<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="For the Wanderer">
    <title>Church</title>
    <style>
        * { margin:0; padding:0; overflow:hidden; }
        body { background:#111; perspective:800px; }
        canvas { display:block; }
    </style>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.168/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 5);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setAnimationLoop(animate);
document.body.appendChild(renderer.domElement);

const light = new THREE.PointLight(0xffaa77, 1.5, 10);
light.position.set(0, 2.5, 0);
scene.add(light);

const ambient = new THREE.AmbientLight(0x404040, 0.2);
scene.add(ambient);

const roomGeo = new THREE.BoxGeometry(10, 6, 10);
const roomMat = new THREE.MeshStandardMaterial({ color:0x222222, roughness:0.9 });
const room = new THREE.Mesh(roomGeo, roomMat);
scene.add(room);

const chairGeo = new THREE.BoxGeometry(0.8, 0.9, 0.8);
const chairMat = new THREE.MeshStandardMaterial({ color:0x3a2a1a });
const chair = new THREE.Mesh(chairGeo, chairMat);
chair.position.set(0, 0.45, -1);
scene.add(chair);

const candleGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.3, 16);
const candleMat = new THREE.MeshStandardMaterial({ color:0xeeeecc });
const candle = new THREE.Mesh(candleGeo, candleMat);
candle.position.set(0, 1.35, -1);
scene.add(candle);

const flameGeo = new THREE.SphereGeometry(0.03, 8, 8);
const flameMat = new THREE.MeshBasicMaterial({ color:0xffaa33 });
const flame = new THREE.Mesh(flameGeo, flameMat);
flame.position.set(0, 1.55, -1);
scene.add(flame);

let pulse = 0;
function animate(t) {
    pulse = (t % 777) / 777;
    const s = 1 + 0.2 * Math.sin(pulse * Math.PI);
    flame.scale.set(s, s, s);
    light.intensity = 1.5 + 0.4 * Math.sin(pulse * Math.PI);
    renderer.render(scene, camera);
}

addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
