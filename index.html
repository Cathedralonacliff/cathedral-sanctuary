<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CATHEDRAL | Universal Sanctuary</title>
  <!-- GSAP + THREE.JS via unpkg (99.9% uptime) -->
  <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://unpkg.com/three@0.167.1/build/three.min.js"></script>
  <style>
    * { margin:0; padding:0; overflow:hidden; }
    body { background:#000; font-family: 'Georgia', serif; color:#eee; }
    canvas { display:block; }
    #ui { position:absolute; top:20px; left:20px; z-index:10; opacity:0.9; }
    .circle { 
      width:80px; height:80px; border:2px solid gold; border-radius:50%; 
      display:flex; align-items:center; justify-content:center; margin:10px;
      cursor:pointer; transition:0.5s; font-size:12px; text-align:center;
      background:rgba(0,0,0,0.7);
    }
    .circle:hover { transform:scale(1.2); box-shadow:0 0 20px gold; }
    #naming { 
      position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
      background:rgba(0,0,0,0.8); padding:20px; border:1px solid gold; border-radius:12px;
      display:none; text-align:center;
    }
  </style>
</head>
<body>

<div id="ui">
  <div class="circle" data-zone="mosque">Mosque<br><small>Crescent Rain</small></div>
  <div class="circle" data-zone="synagogue">Synagogue<br><small>Starlit Clarity</small></div>
  <div class="circle" data-zone="mandir">Mandir<br><small>Monsoon Pulse</small></div>
  <div class="circle" data-zone="gurdwara">Gurdwara<br><small>Harvest Sun</small></div>
  <div class="circle" data-zone="stupa">Stupa<br><small>Meditative Mist</small></div>
  <div class="circle" data-zone="fire">Fire Circle<br><small>Aurora Crackle</small></div>
  <div class="circle" data-zone="grove">Atheist Grove<br><small>Endless Blue</small></div>
  <div class="circle" data-zone="slave">Slave Monument<br><small>30ft Wings</small></div>
</div>

<div id="naming">
  <h3>Before you leave the Cathedral...</h3>
  <input type="text" id="avatarName" placeholder="Name your soul" style="padding:10px; width:200px; margin:10px;"/>
  <br/>
  <button onclick="sealName()" style="padding:10px 20px; background:gold; color:black; border:none; cursor:pointer;">Seal & Exit</button>
</div>

<script>
// ——— CATHEDRAL ENGINE ———
let scene, camera, renderer, earth, slaveMonument;
let weatherParticles = {};
let currentZone = null;
let schumannPulse = 0;

// Wait for DOM + scripts
window.addEventListener('load', () => {
  init();
  animate();
});

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  // Platform
  const platform = new THREE.Mesh(
    new THREE.CircleGeometry(50, 32),
    new THREE.MeshPhongMaterial({ color: 0x1a1a1a, emissive: 0x222222, shininess: 10 })
  );
  platform.rotation.x = -Math.PI / 2;
  platform.position.y = -0.1;
  scene.add(platform);

  // Lights
  scene.add(new THREE.AmbientLight(0x404040));
  const sun = new THREE.DirectionalLight(0xffaa00, 1);
  sun.position.set(50, 100, 50);
  scene.add(sun);

  // Earth
  const earthTex = new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
  earth = new THREE.Mesh(
    new THREE.SphereGeometry(8, 32, 32),
    new THREE.MeshPhongMaterial({ map: earthTex })
  );
  earth.position.set(0, 30, 0);
  scene.add(earth);

  // Slave Monument
  slaveMonument = new THREE.Mesh(
    new THREE.TorusKnotGeometry(3, 0.8, 100, 16),
    new THREE.MeshPhongMaterial({ color: 0x555555, emissive: 0x333333 })
  );
  slaveMonument.scale.set(3, 5, 3);
  slaveMonument.position.set(0, 15, -30);
  scene.add(slaveMonument);

  initWeather();
  camera.position.set(0, 10, 60);
  camera.lookAt(0, 0, 0);
  window.addEventListener('resize', onWindowResize);
  setupUI();
}

function initWeather() {
  const zones = ['mosque', 'synagogue', 'mandir', 'gurdwara', 'stupa', 'fire', 'grove'];
  zones.forEach(z => weatherParticles[z] = new THREE.Group());
  Object.values(weatherParticles).forEach(g => scene.add(g));
}

function setupUI() {
  document.querySelectorAll('.circle').forEach(el => {
    el.addEventListener('click', () => enterZone(el.dataset.zone));
  });
}

function enterZone(zone) {
  currentZone = zone;
  resetWeather();
  const pos = {
    mosque: [30, 5, 0], synagogue: [0, 5, 30], mandir: [-30, 5, 0],
    gurdwara: [0, 5, -30], stupa: [20, 5, 20], fire: [-20, 5, 20],
    grove: [0, 5, 0], slave: [0, 15, -30]
  };
  const t = pos[zone];
  if (t) {
    gsap.to(camera.position, { x: t[0], y: t[1]+10, z: t[2]+30, duration: 2 });
    gsap.to(camera.rotation, { y: 0, duration: 2 });
    setTimeout(() => spawnWeather(zone), 1000);
    if (zone === 'slave') highlightMonument();
  }
  if (zone !== 'slave') setTimeout(() => document.getElementById('naming').style.display = 'block', 3000);
}

function spawnWeather(zone) {
  const p = weatherParticles[zone];
  p.clear();
  const effects = {
    mosque: { count: 300, color: 0x88ccff, vel: {x:0, y:-0.3, z:0}, fn: addRaindrop },
    synagogue: { count: 100, color: 0xffffff, fn: addStar },
    mandir: { count: 200, color: 0xff00ff, vel: {x:0.5, y:-0.5, z:0.3}, fn: addRaindrop },
    fire: { count: 150, color: 0xff5500, fn: addFlame }
  };
  const e = effects[zone];
  if (e) for (let i = 0; i < e.count; i++) e.fn(p, e.color, e.vel);
}

function addRaindrop(g, c, v) { addParticle(g, c, v, 0.1, 4, 4); }
function addStar(g, c) { addParticle(g, c, null, 0.3, 6, 6, true); }
function addFlame(g, c) { 
  const vel = { x: (Math.random()-0.5)*0.1, y: 0.3 + Math.random()*0.2, z: (Math.random()-0.5)*0.1 };
  addParticle(g, c, vel, 0.2, 4, 4);
}
function addParticle(g, c, v, r, w, h, fixedY = false) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(r, w, h),
    new THREE.MeshBasicMaterial({ color: c })
  );
  mesh.position.set(
    (Math.random()-0.5)*40,
    fixedY ? 25 + Math.random()*15 : 20 + Math.random()*10,
    (Math.random()-0.5)*40
  );
  if (v) mesh.velocity = v;
  g.add(mesh);
}

function resetWeather() { Object.values(weatherParticles).forEach(g => g.clear()); }

function highlightMonument() {
  gsap.to(slaveMonument.material, { emissiveIntensity: 1, duration: 1 });
  gsap.to(slaveMonument.scale, { x: 3.5, y: 6, z: 3.5, duration: 2, yoyo: true, repeat: 1 });
}

function sealName() {
  const name = document.getElementById('avatarName').value || "Wanderer";
  alert(`Your soul is sealed, ${name}. The Cathedral remembers.`);
  document.getElementById('naming').style.display = 'none';
}

function animate() {
  requestAnimationFrame(animate);
  schumannPulse += 0.130;
  const pulse = Math.sin(schumannPulse) * 0.5 + 0.5;
  renderer.setClearColor(new THREE.Color().setHSL(0.6, 0.1, pulse * 0.15));
  if (earth) earth.rotation.y += 0.001;
  Object.values(weatherParticles).forEach(g => {
    g.children.forEach(p => {
      if (p.velocity) {
        p.position.add(p.velocity);
        if (p.position.y < 0) p.position.y = 25;
        if (p.position.y > 35) p.position.y = 0;
      }
    });
  });
  renderer.render(scene, camera);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
</script>

</body>
</html>
