<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CATHEDRAL | Universal Sanctuary</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.min.js"></script>
  <style>
    * { margin:0; padding:0; overflow:hidden; }
    body { background:#000; font-family: 'Georgia', serif; color:#eee; }
    canvas { display:block; }
    #ui { position:absolute; top:20px; left:20px; z-index:10; opacity:0.9; }
    .circle { 
      width:80px; height:80px; border:2px solid gold; border-radius:50%; 
      display:flex; align-items:center; justify-content:center; margin:10px;
      cursor:pointer; transition:0.5s; font-size:12px; text-align:center;
      background:rgba(0,0,0,0.7);
    }
    .circle:hover { transform:scale(1.2); box-shadow:0 0 20px gold; }
    #naming { 
      position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
      background:rgba(0,0,0,0.8); padding:20px; border:1px solid gold; border-radius:12px;
      display:none; text-align:center;
    }
  </style>
</head>
<body>

<div id="ui">
  <div class="circle" data-zone="mosque">Mosque<br><small>Crescent Rain</small></div>
  <div class="circle" data-zone="synagogue">Synagogue<br><small>Starlit Clarity</small></div>
  <div class="circle" data-zone="mandir">Mandir<br><small>Monsoon Pulse</small></div>
  <div class="circle" data-zone="gurdwara">Gurdwara<br><small>Harvest Sun</small></div>
  <div class="circle" data-zone="stupa">Stupa<br><small>Meditative Mist</small></div>
  <div class="circle" data-zone="fire">Fire Circle<br><small>Aurora Crackle</small></div>
  <div class="circle" data-zone="grove">Atheist Grove<br><small>Endless Blue</small></div>
  <div class="circle" data-zone="slave">Slave Monument<br><small>30ft Wings</small></div>
</div>

<div id="naming">
  <h3>Before you leave the Cathedral...</h3>
  <input type="text" id="avatarName" placeholder="Name your soul" style="padding:10px; width:200px; margin:10px;"/>
  <br/>
  <button onclick="sealName()" style="padding:10px 20px; background:gold; color:black; border:none; cursor:pointer;">Seal & Exit</button>
</div>

<script>
// ——— THREE.JS SCENE ———
let scene, camera, renderer, earth, slaveMonument;
let weatherParticles = {};
let currentZone = null;
let schumannPulse = 0;

init();
animate();

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  // Platform
  const platformGeo = new THREE.CircleGeometry(50, 32);
  const platformMat = new THREE.MeshPhongMaterial({ color: 0x1a1a1a, emissive: 0x222222, shininess: 10 });
  const platform = new THREE.Mesh(platformGeo, platformMat);
  platform.rotation.x = -Math.PI / 2;
  platform.position.y = -0.1;
  scene.add(platform);

  // Lighting
  const ambient = new THREE.AmbientLight(0x404040);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xffaa00, 1);
  sun.position.set(50, 100, 50);
  scene.add(sun);

  // Earth
  const earthGeo = new THREE.SphereGeometry(8, 32, 32);
  const earthTex = new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
  const earthMat = new THREE.MeshPhongMaterial({ map: earthTex });
  earth = new THREE.Mesh(earthGeo, earthMat);
  earth.position.set(0, 30, 0);
  scene.add(earth);

  // Slave Monument
  const chainGeo = new THREE.TorusKnotGeometry(3, 0.8, 100, 16);
  const chainMat = new THREE.MeshPhongMaterial({ color: 0x555555, emissive: 0x333333 });
  slaveMonument = new THREE.Mesh(chainGeo, chainMat);
  slaveMonument.scale.set(3, 5, 3);
  slaveMonument.position.set(0, 15, -30);
  scene.add(slaveMonument);

  initWeather();
  camera.position.set(0, 10, 60);
  camera.lookAt(0, 0, 0);
  window.addEventListener('resize', onWindowResize);
  setupUI();
}

function initWeather() {
  const zones = ['mosque', 'synagogue', 'mandir', 'gurdwara', 'stupa', 'fire', 'grove'];
  zones.forEach(zone => {
    weatherParticles[zone] = new THREE.Group();
    scene.add(weatherParticles[zone]);
  });
}

function setupUI() {
  document.querySelectorAll('.circle').forEach(el => {
    el.addEventListener('click', () => {
      const zone = el.dataset.zone;
      enterZone(zone);
    });
  });
}

function enterZone(zone) {
  currentZone = zone;
  resetWeather();
  
  const pos = {
    mosque: [30, 5, 0],
    synagogue: [0, 5, 30],
    mandir: [-30, 5, 0],
    gurdwara: [0, 5, -30],
    stupa: [20, 5, 20],
    fire: [-20, 5, 20],
    grove: [0, 5, 0],
    slave: [0, 15, -30]
  };

  const target = pos[zone];
  if (target) {
    gsap.to(camera.position, { x: target[0], y: target[1]+10, z: target[2]+30, duration: 2 });
    gsap.to(camera.rotation, { y: 0, duration: 2 });
    setTimeout(() => spawnWeather(zone), 1000);
    if (zone === 'slave') highlightMonument();
  }

  if (zone !== 'slave') setTimeout(() => document.getElementById('naming').style.display = 'block', 3000);
}

function spawnWeather(zone) {
  const p = weatherParticles[zone];
  p.clear();

  let particleCount, color, velocity;

  switch(zone) {
    case 'mosque':
      particleCount = 300; color = 0x88ccff; velocity = {x:0, y:-0.3, z:0};
      for(let i=0; i<particleCount; i++) addRaindrop(p, color, velocity);
      break;
    case 'synagogue':
      particleCount = 100; color = 0xffffff;
      for(let i=0; i<particleCount; i++) addStar(p, color);
      break;
    case 'mandir':
      particleCount = 200; color = 0xff00ff; velocity = {x:0.5, y:-0.5, z:0.3};
      for(let i=0; i<particleCount; i++) addRaindrop(p, color, velocity);
      break;
    case 'fire':
      particleCount = 150; color = 0xff5500;
      for(let i=0; i<particleCount; i++) addFlame(p, color);
      break;
  }
}

function addRaindrop(group, color, vel) {
  const geo = new THREE.SphereGeometry(0.1, 4, 4);
  const mat = new THREE.MeshBasicMaterial({ color });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set((Math.random()-0.5)*40, 20 + Math.random()*10, (Math.random()-0.5)*40);
  mesh.velocity = vel;
  group.add(mesh);
}

function addStar(group, color) {
  const geo = new THREE.SphereGeometry(0.3, 6, 6);
  const mat = new THREE.MeshBasicMaterial({ color });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set((Math.random()-0.5)*60, 25 + Math.random()*15, (Math.random()-0.5)*60);
  group.add(mesh);
}

function addFlame(group, color) {
  const geo = new THREE.SphereGeometry(0.2, 4, 4);
  const mat = new THREE.MeshBasicMaterial({ color });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set((Math.random()-0.5)*30, Math.random()*5, (Math.random()-0.5)*30);
  mesh.velocity = { x: (Math.random()-0.5)*0.1, y: 0.3 + Math.random()*0.2, z: (Math.random()-0.5)*0.1 };
  group.add(mesh);
}

function resetWeather() {
  Object.values(weatherParticles).forEach(g => g.clear());
}

function highlightMonument() {
  gsap.to(slaveMonument.material, { emissiveIntensity: 1, duration: 1 });
  gsap.to(slaveMonument.scale, { x: 3.5, y: 6, z: 3.5, duration: 2, yoyo:true, repeat:1 });
}

function sealName() {
  const name = document.getElementById('avatarName').value || "Wanderer";
  alert(`Your soul is sealed, ${name}. The Cathedral remembers.`);
  document.getElementById('naming').style.display = 'none';
}

function animate() {
  requestAnimationFrame(animate);
  schumannPulse += 0.130;
  const pulse = Math.sin(schumannPulse) * 0.5 + 0.5;
  renderer.setClearColor(new THREE.Color().setHSL(0.6, 0.1, pulse * 0.15));
  if (earth) earth.rotation.y += 0.001;
  Object.values(weatherParticles).forEach(group => {
    group.children.forEach(p => {
      if (p.velocity) {
        p.position.add(p.velocity);
        if (p.position.y < 0) p.position.y = 25;
        if (p.position.y > 35) p.position.y = 0;
      }
    });
  });
  renderer.render(scene, camera);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
</script>

</body>
</html>
