<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CATHEDRAL | First Breath</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.min.js"></script>
  <style>
    * { margin:0; padding:0; overflow:hidden; }
    body { background:#000; font-family: 'Georgia', serif; color:#eee; }
    canvas { display:block; }
    #ui { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:10; }
    .circle { 
      width:120px; height:120px; border:3px solid gold; border-radius:50%; 
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      cursor:pointer; font-size:14px; text-align:center;
      background:rgba(0,0,0,0.7); backdrop-filter:blur(4px);
      transition:0.4s;
    }
    .circle:hover { transform:scale(1.2); box-shadow:0 0 30px gold; }
    #naming { 
      position:absolute; bottom:40px; left:50%; transform:translateX(-50%);
      background:rgba(0,0,0,0.9); padding:20px; border:1px solid gold; border-radius:12px;
      display:none; text-align:center; max-width:280px;
    }
    #naming input { padding:10px; width:200px; margin:8px; border:1px solid gold; border-radius:6px; background:rgba(255,255,255,0.1); color:#eee; }
    #naming button { padding:10px 24px; background:gold; color:black; border:none; border-radius:6px; cursor:pointer; font-weight:bold; }
  </style>
</head>
<body>

<div id="ui">
  <div class="circle" data-zone="mosque">Mosque<br><small>Crescent Rain</small></div>
</div>

<div id="naming">
  <h3>Name your soul...</h3>
  <input type="text" id="avatarName" placeholder="Who are you?" />
  <br/>
  <button onclick="sealName()">Seal & Rise</button>
</div>

<script>
let scene, camera, renderer, rain = [];
const ZONE = 'mosque';

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x404040));
  const light = new THREE.DirectionalLight(0x88ccff, 1);
  light.position.set(20, 40, 20);
  scene.add(light);

  camera.position.z = 80;

  // Rain
  for (let i = 0; i < 200; i++) {
    const drop = new THREE.Mesh(
      new THREE.SphereGeometry(0.15, 4, 4),
      new THREE.MeshBasicMaterial({ color: 0x88ccff })
    );
    drop.position.set(
      (Math.random()-0.5)*60,
      30 + Math.random()*20,
      (Math.random()-0.5)*60
    );
    drop.velocity = { x: 0, y: -0.4, z: 0 };
    rain.push(drop);
    scene.add(drop);
  }

  document.querySelector('.circle').addEventListener('click', () => {
    gsap.to(camera.position, { z: 40, duration: 2 });
    setTimeout(() => document.getElementById('naming').style.display = 'block', 2000);
  });

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  rain.forEach(d => {
    d.position.add(d.velocity);
    if (d.position.y < -10) d.position.y = 40;
  });
  renderer.render(scene, camera);
}

function sealName() {
  const name = document.getElementById('avatarName').value || "Wanderer";
  alert(`✨ ${name}, you are sealed in the first breath. ✨`);
  document.getElementById('naming').style.display = 'none';
}

window.onload = init;
</script>

</body>
</html>
